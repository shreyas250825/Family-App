<!doctype html>
<html lang="en" data-palette="blush" data-appearance="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FamZee — Your family's private space</title>
    <meta name="description" content="FamZee brings photos, events, albums, and messages into one beautiful private space built exclusively for your family." />
    <meta property="og:title" content="FamZee — Your family's private space" />
    <meta property="og:description" content="Share memories, plan events, and stay connected — built for families, not the public internet." />
    <meta name="theme-color" content="#FFF9FC" />
    <script>
      try {
        var p = localStorage.getItem('famzee-demo-palette') || 'blush';
        var a = localStorage.getItem('famzee-demo-appearance') || 'light';
        document.documentElement.setAttribute('data-palette', p);
        document.documentElement.setAttribute('data-appearance', a);
        document.documentElement.style.colorScheme = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
